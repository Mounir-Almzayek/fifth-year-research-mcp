<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>مساعد السنة الخامسة</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main>
<header><span class="sun">☀</span><div><h1>غروب السنة الخامسة</h1><p>Solar Intelligence — Graduation Research Hub</p></div><button id="logout" hidden>خروج</button></header>
<section id="login"><h2>أهلاً بفريق الأبحاث</h2><p>الدخول متاح لأعضاء Appwrite المصرح لهم فقط.</p><form id="loginForm">
<label>البريد الإلكتروني<input id="email" type="email" autocomplete="email" required></label>
<label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label>
<button type="submit">تسجيل الدخول</button></form></section>
<section id="workspace" hidden><p id="identity"></p>
<div class="modes"><button id="browse">استعراض المشروع</button><button id="search">بحث بالعنوان</button><button id="assistant">مساعد الأبحاث</button></div>
<div id="messages" aria-live="polite"></div>
<form id="queryForm"><textarea id="query" maxlength="4000" placeholder="اكتب كلمة بحث أو سؤالاً عن صفحات المشروع" required rows="3"></textarea><button id="send" type="submit">إرسال</button></form>
<p class="hint">القراءة فقط مفعّلة افتراضياً. لا ترسل معلومات حساسة للمساعد.</p></section>
<p id="status" role="status"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/appwrite@29.0.0"></script><script src="/app.js" defer></script>
</body></html>
