name: Verify Notion API access
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notion:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Notion token and research page permission
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ROOT_ID: ${{ vars.NOTION_ROOT_PAGE_ID }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then echo "::error::NOTION_TOKEN secret missing"; exit 1; fi
          if [ -z "$ROOT_ID" ]; then echo "::error::NOTION_ROOT_PAGE_ID variable missing"; exit 1; fi
          code=$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $NOTION_TOKEN" -H 'Notion-Version: 2022-06-28' "https://api.notion.com/v1/pages/$ROOT_ID")
          if [ "$code" != "200" ]; then echo "::error::Notion page check returned HTTP $code"; exit 1; fi
          echo "Notion Integration has access to the approved research root (HTTP 200)."
